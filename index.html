<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNEAKER INVENTORY | 44SNKRS.PT</title>
    <meta name="description" content="Pares e peças disponíveis, com tamanhos e preços. Para comprar, envia mensagem por WhatsApp ou Instagram.">

    <!-- Link preview when the catalogue is shared in WhatsApp groups -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="SNEAKER INVENTORY | 44SNKRS.PT">
    <meta property="og:description" content="Pares e peças disponíveis, com tamanhos e preços. Para comprar, envia mensagem por WhatsApp ou Instagram.">
    <meta property="og:url" content="https://davidr44.github.io/sneakerinventory/">
    <meta property="og:locale" content="pt_PT">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="#" class="logo">SNEAKER <span>INVENTORY</span></a>
        </div>
    </header>

    <main class="container">
        <div class="controls">
            <div class="search-bar">
                <div class="input-wrapper">
                    <i class="fas fa-search search-icon" aria-hidden="true"></i>
                    <input type="search" id="searchInput" placeholder="Pesquisar pelo nome ou SKU..." aria-label="Pesquisar pelo nome ou SKU">
                </div>
            </div>

            <button type="button" class="filter-btn active" data-filter="all"><i class="fas fa-bars" aria-hidden="true"></i> Padrão</button>
            <button type="button" class="filter-btn" data-filter="price-asc"><i class="fas fa-sort-amount-down-alt" aria-hidden="true"></i> Menor-Maior Preço</button>
            <button type="button" class="filter-btn" data-filter="price-desc"><i class="fas fa-sort-amount-up-alt" aria-hidden="true"></i> Maior-Menor Preço</button>

            <button type="button" id="toggleSizeFilterBtn" class="filter-btn" aria-expanded="false" aria-controls="sizeFilterDropdown"><i class="fas fa-ruler-horizontal" aria-hidden="true"></i> Filtrar por Tamanho</button>

            <div id="sizeFilterDropdown" class="size-filter-dropdown">
                <div class="size-filter-section" id="footwearSizeSection">
                    <h4>EU Footwear</h4>
                    <div class="size-options" id="footwearSizeOptions"></div>
                </div>

                <div class="size-filter-section" id="clothingSizeSection">
                    <h4>Clothing</h4>
                    <div class="size-options" id="clothingSizeOptions"></div>
                </div>

                <button type="button" id="applySizeFilterBtn" class="apply-filter-btn">Aplicar Filtro</button>
            </div>
        </div>

        <div class="selected-size-chips-wrapper" id="selectedSizeChipsWrapper">
            <div class="selected-size-chips-container" id="selectedSizeChipsContainer"></div>
        </div>

        <div class="product-grid" id="productGrid"></div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 44SNKRS.PT. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
